name: "Deploy"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout admin
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout zen-fs-sync
        uses: actions/checkout@v4
        with:
          repository: weijia/zen-fs-sync
          path: deps/zen-fs-sync

      - name: Checkout zen-fs-config
        uses: actions/checkout@v4
        with:
          repository: weijia/zen-fs-config
          path: deps/zen-fs-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build zen-fs-sync
        run: |
          cd deps/zen-fs-sync
          npm install
          npm run build

      - name: Build zen-fs-config
        run: |
          cd deps/zen-fs-config
          npm install
          npm run build

      - name: Create sibling symlinks for file: dependencies
        run: |
          ln -s "$GITHUB_WORKSPACE/deps/zen-fs-sync" "$GITHUB_WORKSPACE/../zen-fs-sync"
          ln -s "$GITHUB_WORKSPACE/deps/zen-fs-config" "$GITHUB_WORKSPACE/../zen-fs-config"

      - name: Install dependencies
        run: npm ci

      - name: Build the project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-pages:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
